<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TinyRadi</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <h1 class="title">TinyRadi</h1>
      <label class="toggle" for="enabled-toggle">
        <input id="enabled-toggle" type="checkbox" />
        <span>TinyRadiを有効にする</span>
      </label>
      <label class="toggle" for="hide-footer-toggle">
        <input id="hide-footer-toggle" type="checkbox" />
        <span>下部のリンクを非表示にする</span>
      </label>
      <p id="status" class="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
